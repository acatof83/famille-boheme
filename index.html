<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Le Grand Chêne Millénaire — Domaine de Bohême</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Georgia', serif; background-color: #0d1608; color: #f3e5ab; }

        /* ÉCRAN D'ACCÈS */
        .gate-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #1e3f1c url('prairie.jpg') no-repeat center center; background-size: cover; display: flex; justify-content: center; align-items: center; z-index: 100; transition: opacity 1s ease-in-out, visibility 1s ease-in-out; }
        .door-hitbox { position: absolute; top: 25%; left: 41%; width: 18%; height: 55%; cursor: pointer; z-index: 10; background: transparent; border: 2px dashed rgba(245, 215, 127, 0.4); border-radius: 4px; transition: border-color 0.3s, background 0.3s; }
        .door-hitbox:hover { border-color: #f5d77f; background: rgba(245, 215, 127, 0.1); }
        .keypad-modal { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 10, 3, 0.88); backdrop-filter: blur(4px); justify-content: center; align-items: center; z-index: 20; padding: 15px; }
        .gate-card { background: linear-gradient(145deg, rgba(28, 14, 6, 0.95), rgba(10, 5, 2, 0.98)); border: 2px solid #b8860b; border-radius: 16px; padding: 1.5rem; text-align: center; max-width: 320px; width: 100%; box-shadow: 0 15px 40px rgba(0,0,0,0.9); position: relative; }
        .close-keypad-btn { position: absolute; top: 10px; right: 15px; background: none; border: none; color: #c0a87a; font-size: 1.2rem; cursor: pointer; }
        .gate-card h2 { color: #f5d77f; font-size: 1.3rem; margin-bottom: 0.3rem; text-transform: uppercase; letter-spacing: 1px; }
        .gate-card p { color: #c0a87a; font-size: 0.8rem; margin-bottom: 1rem; font-style: italic; }
        .code-display { background: #0a0502; border: 2px solid #b8860b; border-radius: 8px; color: #f5d77f; font-size: 1.6rem; letter-spacing: 6px; padding: 8px; margin-bottom: 1rem; height: 48px; display: flex; align-items: center; justify-content: center; box-shadow: inset 0 3px 6px rgba(0,0,0,0.8); }
        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 0.8rem; }
        .key-btn { background: linear-gradient(180deg, #b8860b, #6b4212); color: #fff; border: 1px solid #f5d77f; border-radius: 8px; font-size: 1.1rem; font-weight: bold; padding: 10px 0; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .key-btn:active { background: linear-gradient(180deg, #d4af37, #8b5a2b); }
        .error-msg { color: #e74c3c; font-size: 0.8rem; height: 18px; font-weight: bold; }

        /* SCÈNE DE L'ARBRE */
        .scene-tree { position: relative; width: 100vw; height: 100vh; background-color: #0d1608; display: flex; flex-direction: column; justify-content: center; align-items: center; opacity: 0; transition: opacity 1s ease-in-out; overflow: hidden; }
        header { position: absolute; top: 10px; width: 100%; text-align: center; z-index: 30; pointer-events: none; }
        header h1 { font-size: 1.4rem; color: #f5d77f; text-shadow: 2px 2px 10px rgba(0, 0, 0, 0.95); letter-spacing: 1px; text-transform: uppercase; }
        header p { color: #c9dbb8; font-size: 0.75rem; text-shadow: 1px 1px 6px rgba(0, 0, 0, 0.95); margin-top: 1px; font-style: italic; }

        .tree-wrapper { position: relative; width: 100%; height: 100%; max-width: 100vw; max-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .tree-container { position: relative; width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.77vh; margin: auto; }
        .tree-image { width: 100%; height: 100%; object-fit: contain; display: block; }

        .trunk-plaque { position: absolute; top: 79%; left: 50%; transform: translate(-50%, -50%); width: 28%; max-width: 240px; background: linear-gradient(145deg, rgba(28, 14, 6, 0.88), rgba(10, 5, 2, 0.92)); border: 1px solid rgba(184, 134, 11, 0.7); box-shadow: 0 8px 25px rgba(0,0,0,0.9); border-radius: 8px; padding: 0.4rem 0.8rem; text-align: center; cursor: pointer; z-index: 25; transition: transform 0.3s; }
        .trunk-plaque h2 { font-size: 0.75rem; color: #f5d77f; margin-bottom: 0.1rem; text-transform: uppercase; }
        .trunk-plaque p { font-size: 0.55rem; color: #c0a87a; }

        .member-node { position: absolute; width: 6.5%; padding-bottom: 6.5%; border-radius: 50%; cursor: pointer; z-index: 20; overflow: hidden; transition: all 0.3s ease; background: rgba(0,0,0,0.5); border: 2px solid #b8860b; box-shadow: 0 5px 15px rgba(0,0,0,0.8); transform: translate(-50%, -50%); -webkit-mask-image: radial-gradient(circle, rgba(0,0,0,1) 40%, rgba(0,0,0,0.8) 65%, rgba(0,0,0,0) 90%); mask-image: radial-gradient(circle, rgba(0,0,0,1) 40%, rgba(0,0,0,0.8) 65%, rgba(0,0,0,0) 90%); }
        .member-node.lana-node { width: 8%; padding-bottom: 8%; }
        .member-node img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        
        /* TITRES SOUS LES PASTILLES (PC) */
        .member-label { position: absolute; transform: translateX(-50%); background: rgba(10, 5, 2, 0.9); color: #f5d77f; padding: 1px 5px; border-radius: 3px; font-size: 0.55rem; font-weight: bold; white-space: nowrap; border: 1px solid rgba(184, 134, 11, 0.5); pointer-events: none; z-index: 21; }

        .speech-bubble { display: none; position: absolute; background: #fff; color: #221207; padding: 6px 10px; border-radius: 10px; font-weight: bold; font-size: 0.75rem; box-shadow: 0 5px 15px rgba(0,0,0,0.5); z-index: 35; pointer-events: none; }

        /* MODALE LECTEUR MÉDIA */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 12, 3, 0.92); backdrop-filter: blur(8px); justify-content: center; align-items: center; z-index: 50; padding: 8px; }
        .prairie-content { position: relative; background: url('arbre.jpg') no-repeat center center; background-size: cover; border: 2px solid #b8860b; border-radius: 14px; max-width: 650px; width: 100%; max-height: 96vh; padding: 0.8rem; text-align: center; box-shadow: 0 20px 45px rgba(0,0,0,0.95); display: flex; flex-direction: column; overflow: hidden; }
        .prairie-content::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(12, 20, 8, 0.88); z-index: 1; }
        .prairie-header, .media-player-container, .prairie-thumbnails, .close-prairie-btn { position: relative; z-index: 2; }
        .prairie-header h3 { color: #f5d77f; font-size: 1.1rem; margin-bottom: 0.4rem; text-transform: uppercase; }
        .media-player-container { display: flex; align-items: center; justify-content: center; gap: 6px; margin-bottom: 0.6rem; flex-grow: 1; min-height: 180px; max-height: 52vh; }
        .media-screen { position: relative; max-height: 100%; display: flex; justify-content: center; align-items: center; width: 100%; height: 100%; }
        .media-screen img, .media-screen video { max-width: 100%; max-height: 48vh; object-fit: contain; border: 2px solid #b8860b; border-radius: 8px; background: #000; }
        .media-counter { position: absolute; bottom: 6px; right: 6px; background: rgba(10, 5, 2, 0.85); color: #f5d77f; padding: 2px 5px; border-radius: 4px; font-size: 0.65rem; border: 1px solid rgba(184, 134, 11, 0.5); z-index: 3; }
        .media-nav-btn { background: linear-gradient(180deg, #b8860b, #6b4212); color: #fff; border: 1px solid #f5d77f; width: 32px; height: 32px; border-radius: 50%; font-size: 0.9rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        
        .prairie-thumbnails { display: flex; gap: 5px; overflow-x: auto; padding: 4px 2px; justify-content: flex-start; margin-bottom: 0.6rem; max-height: 48px; width: 100%; -webkit-overflow-scrolling: touch; scrollbar-width: thin; }
        .prairie-thumbnails::-webkit-scrollbar { height: 4px; }
        .prairie-thumbnails::-webkit-scrollbar-thumb { background: #b8860b; border-radius: 2px; }

        .mini-thumb-wrap { position: relative; width: 36px; height: 36px; flex-shrink: 0; cursor: pointer; background: #1a0f07; border-radius: 4px; border: 1px solid #5a3818; overflow: hidden; display: flex; align-items: center; justify-content: center; transition: transform 0.2s; }
        .mini-thumb-wrap.active { border-color: #f5d77f; box-shadow: 0 0 6px rgba(245, 215, 127, 0.8); transform: scale(1.05); }
        .mini-thumb { width: 100%; height: 100%; object-fit: cover; opacity: 0.5; }
        .mini-thumb-wrap.active .mini-thumb { opacity: 1; }
        .video-badge { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.6); color: #f5d77f; font-size: 0.65rem; padding: 1px 3px; border-radius: 50%; pointer-events: none; border: 1px solid #f5d77f; }
        .close-prairie-btn { background: linear-gradient(180deg, #b8860b, #6b4212); color: #fff; border: 1px solid #f5d77f; padding: 5px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 0.8rem; align-self: center; }

        @media (max-width: 768px) {
            header { top: 5px; }
            header h1 { font-size: 1rem; }
            header p { font-size: 0.6rem; }
            .door-hitbox { top: 30%; left: 35%; width: 30%; height: 45%; }
            .member-node { border-width: 1px; }
            .member-node.lana-node { width: 9%; padding-bottom: 9%; }
            
            /* TAILLE ENCORE PLUS FINE DES ÉTIQUETTES UNIQUEMENT SUR MOBILE */
            .member-label { font-size: 0.28rem !important; padding: 0px 2px !important; border-radius: 2px !important; border-width: 0.5px !important; }
            
            .trunk-plaque { width: 38% !important; max-width: 130px !important; padding: 0.15rem 0.25rem !important; }
            .trunk-plaque h2 { font-size: 0.5rem !important; }
            .trunk-plaque p { font-size: 0.4rem !important; }
            .prairie-content { padding: 0.6rem; }
            .media-player-container { min-height: 150px; }
            .media-nav-btn { width: 28px; height: 28px; font-size: 0.8rem; }
            .mini-thumb-wrap { width: 32px; height: 32px; }
        }
    </style>
</head>
<body>

    <!-- ÉCRAN D'ACCÈS -->
    <div class="gate-screen" id="gateScreen">
        <div class="door-hitbox" onclick="openKeypad()" title="Cliquez sur la porte pour entrer le code"></div>

        <div class="keypad-modal" id="keypadModal">
            <div class="gate-card">
                <button class="close-keypad-btn" onclick="closeKeypad()">✕</button>
                <h2>Domaine de Bohême</h2>
                <p>Entrez le code secret pour ouvrir la porte</p>
                <div class="code-display" id="codeDisplay">______</div>
                <div class="keypad">
                    <button class="key-btn" onclick="pressKey('1')">1</button>
                    <button class="key-btn" onclick="pressKey('2')">2</button>
                    <button class="key-btn" onclick="pressKey('3')">3</button>
                    <button class="key-btn" onclick="pressKey('4')">4</button>
                    <button class="key-btn" onclick="pressKey('5')">5</button>
                    <button class="key-btn" onclick="pressKey('6')">6</button>
                    <button class="key-btn" onclick="pressKey('7')">7</button>
                    <button class="key-btn" onclick="pressKey('8')">8</button>
                    <button class="key-btn" onclick="pressKey('9')">9</button>
                    <button class="key-btn" onclick="clearCode()">C</button>
                    <button class="key-btn" onclick="pressKey('0')">0</button>
                    <button class="key-btn" onclick="submitCode()">↵</button>
                </div>
                <div class="error-msg" id="errorMsg"></div>
            </div>
        </div>
    </div>

    <!-- SCÈNE DE L'ARBRE -->
    <div class="scene-tree" id="sceneTree">
        <header>
            <h1>Le Grand Chêne</h1>
            <p>Domaine de Bohême</p>
        </header>

        <div class="tree-wrapper">
            <div class="tree-container" id="treeWrapper">
                <img src="arbre.jpg" alt="Le Grand Chêne" class="tree-image" id="treeImage">
                <div class="trunk-plaque" onclick="openMediaPlayer('souvenirs_partages')">
                    <h2>📜 Souvenirs Partagés</h2>
                    <p>Photos de groupe et événements</p>
                </div>
                <div class="speech-bubble" id="speechBubble">Philippe trop gentil 🐷</div>
            </div>
        </div>
    </div>

    <!-- MODALE LECTEUR MÉDIA -->
    <div class="modal-overlay" id="prairieModal">
        <div class="prairie-content">
            <div class="prairie-header">
                <h3 id="prairieTitle">Album</h3>
            </div>
            <div class="media-player-container">
                <button class="media-nav-btn" onclick="prevMediaItem()">‹</button>
                <div class="media-screen" id="mediaScreenContainer">
                    <div class="media-counter" id="mediaCounter">0 / 0</div>
                </div>
                <button class="media-nav-btn" onclick="nextMediaItem()">›</button>
            </div>
            <div class="prairie-thumbnails" id="prairieThumbnails"></div>
            <button class="close-prairie-btn" onclick="closePrairieModal()">Fermer l'album</button>
        </div>
    </div>

    <script>
        const SECRET_CODE = "141839"; 
        let enteredCode = "";

        function openKeypad() { document.getElementById("keypadModal").style.display = "flex"; clearCode(); }
        function closeKeypad() { document.getElementById("keypadModal").style.display = "none"; }
        function pressKey(digit) {
            if (enteredCode.length < 6) { enteredCode += digit; updateDisplay(); }
            if (enteredCode.length === 6) submitCode();
        }
        function clearCode() { enteredCode = ""; updateDisplay(); document.getElementById("errorMsg").innerText = ""; }
        function updateDisplay() {
            let displayStr = "";
            for (let i = 0; i < 6; i++) displayStr += i < enteredCode.length ? "•" : "_";
            document.getElementById("codeDisplay").innerText = displayStr;
        }
        function submitCode() {
            if (enteredCode === SECRET_CODE) {
                document.getElementById("errorMsg").style.color = "#2ecc71";
                document.getElementById("errorMsg").innerText = "Accès autorisé...";
                setTimeout(() => {
                    const gate = document.getElementById("gateScreen");
                    gate.style.opacity = "0";
                    gate.style.visibility = "hidden";
                    document.getElementById("sceneTree").style.opacity = "1";
                }, 500);
            } else {
                document.getElementById("errorMsg").style.color = "#e74c3c";
                document.getElementById("errorMsg").innerText = "Code incorrect !";
                setTimeout(clearCode, 1000);
            }
        }

        const familyMembers = [
            { id: "mami_nicole", name: "Mami Nicole", top: "18%", left: "42%", folder: "MAMIE NICOLE" },
            { id: "papi_gerard", name: "Papi Gérard", top: "18%", left: "58%", folder: "PAPI GERARD" },
            { id: "fifi", name: "Fifi", top: "27%", left: "21%", folder: "FIFI", isSpecial: "philippe" },
            { id: "tata_coco", name: "Tata Coco", top: "27%", left: "29%", folder: "TATA COCO" },
            { id: "tonton_gigi", name: "Tonton Gigi", top: "27%", left: "48%", folder: "TONTON GIGI" },
            { id: "bibi", name: "Bibi", top: "27%", left: "75%", folder: "BIBI" },
            { id: "chippo", name: "Chippo", top: "37%", left: "33%", folder: "CHIPPO" },
            { id: "mamie_brigitte", name: "Mamie Brigitte", top: "37%", left: "67%", folder: "MAMIE BRIGITTE" },
            { id: "mamie_suze", name: "Mamie Suze", top: "48%", left: "60%", folder: "MAMIE SUZE" },
            { id: "papi_christophe", name: "Papi Christophe", top: "48%", left: "72%", folder: "PAPI CHRISTOPHE" },
            { id: "rody", name: "Rody", top: "59%", left: "35%", folder: "RODY" },
            { id: "anais", name: "Anais", top: "59%", left: "67%", folder: "ANAIS" },
            { id: "lana", name: "Lana", top: "62%", left: "51%", folder: "LANA", isLana: true },
            { id: "souvenirs_partages", name: "Souvenirs Partagés", folder: "souvenirs partagés", isHiddenOnTree: true }
        ];

        let currentActiveMember = null;
        let validMediaList = [];
        let currentIndex = 0;

        window.onload = function() {
            const treeWrapper = document.getElementById("treeWrapper");

            familyMembers.forEach(member => {
                if (member.isHiddenOnTree) return;

                const node = document.createElement("div");
                node.className = "member-node" + (member.isLana ? " lana-node" : "");
                node.style.top = member.top;
                node.style.left = member.left;

                const img = document.createElement("img");
                img.alt = member.name;
                img.src = member.folder + "/1.jpg";

                node.appendChild(img);

                node.onclick = () => {
                    if (member.isSpecial === "philippe") triggerPhilippe();
                    openMediaPlayer(member.id);
                };

                treeWrapper.appendChild(node);

                const label = document.createElement("div");
                label.className = "member-label";
                label.innerText = member.name;
                let offset = member.isLana ? 5.0 : 4.0;
                label.style.top = (parseFloat(member.top) + offset) + "%";
                label.style.left = member.left;
                treeWrapper.appendChild(label);
            });
        };

        async function openMediaPlayer(memberId) {
            const member = familyMembers.find(m => m.id === memberId);
            if (!member) return;

            currentActiveMember = member;
            document.getElementById("prairieTitle").innerText = "Album de " + member.name;

            validMediaList = [];
            const maxCheck = 99;
            let tempChecks = [];

            for (let i = 1; i <= maxCheck; i++) {
                tempChecks.push(checkFileExists(`${member.folder}/${i}.jpg`, false));
                tempChecks.push(checkFileExists(`${member.folder}/${i}.mp4`, true));
            }

            const results = await Promise.all(tempChecks);
            validMediaList = results.filter(item => item !== null);

            if (validMediaList.length === 0) {
                validMediaList.push({ path: `${member.folder}/1.jpg`, isVideo: false });
            }

            currentIndex = 0;
            document.getElementById("prairieModal").style.display = "flex";
            updatePlayerView();
            buildThumbnailsBar();
        }

        function checkFileExists(path, isVideo) {
            return new Promise((resolve) => {
                if (isVideo) {
                    const video = document.createElement('video');
                    video.onloadedmetadata = () => resolve({ path, isVideo: true });
                    video.onerror = () => resolve(null);
                    video.src = path;
                } else {
                    const img = new Image();
                    img.onload = () => resolve({ path, isVideo: false });
                    img.onerror = () => resolve(null);
                    img.src = path;
                }
            });
        }

        function updatePlayerView() {
            if (validMediaList.length === 0) return;

            const screenContainer = document.getElementById("mediaScreenContainer");
            const counterHTML = `<div class="media-counter" id="mediaCounter">${currentIndex + 1} / ${validMediaList.length}</div>`;
            const currentItem = validMediaList[currentIndex];

            if (currentItem.isVideo) {
                screenContainer.innerHTML = `<video controls autoplay src="${currentItem.path}"></video>${counterHTML}`;
            } else {
                screenContainer.innerHTML = `<img src="${currentItem.path}" alt="Photo">${counterHTML}`;
            }

            const container = document.getElementById("prairieThumbnails");
            document.querySelectorAll(".mini-thumb-wrap").forEach((wrap, idx) => {
                if (idx === currentIndex) {
                    wrap.classList.add("active");
                    wrap.scrollIntoView({ behavior: 'smooth', inline: 'nearest', block: 'nearest' });
                } else {
                    wrap.classList.remove("active");
                }
            });
        }

        function nextMediaItem() {
            if (validMediaList.length === 0) return;
            currentIndex = (currentIndex + 1) % validMediaList.length;
            updatePlayerView();
        }

        function prevMediaItem() {
            if (validMediaList.length === 0) return;
            currentIndex = (currentIndex - 1 + validMediaList.length) % validMediaList.length;
            updatePlayerView();
        }

        function buildThumbnailsBar() {
            const container = document.getElementById("prairieThumbnails");
            container.innerHTML = "";

            validMediaList.forEach((media, idx) => {
                const wrap = document.createElement("div");
                wrap.className = "mini-thumb-wrap" + (idx === currentIndex ? " active" : "");

                if (media.isVideo) {
                    const thumb = document.createElement("video");
                    thumb.className = "mini-thumb";
                    thumb.src = media.path + "#t=0.5";
                    thumb.preload = "metadata";
                    thumb.muted = true;
                    wrap.appendChild(thumb);

                    const badge = document.createElement("div");
                    badge.className = "video-badge";
                    badge.innerText = "▶";
                    wrap.appendChild(badge);
                } else {
                    const thumb = document.createElement("img");
                    thumb.className = "mini-thumb";
                    thumb.src = media.path;
                    wrap.appendChild(thumb);
                }

                wrap.onclick = () => { currentIndex = idx; updatePlayerView(); };
                container.appendChild(wrap);
            });
        }

        function closePrairieModal() {
            const activeVideo = document.querySelector(".media-screen video");
            if (activeVideo) activeVideo.pause();
            document.getElementById("prairieModal").style.display = "none";
        }

        function triggerPhilippe() {
            const bubble = document.getElementById("speechBubble");
            bubble.style.bottom = "23%";
            bubble.style.right = "15%";
            bubble.style.display = "block";
            setTimeout(() => { bubble.style.display = "none"; }, 3500);

            try {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const voices = window.speechSynthesis.getVoices();
                    const maleVoice = voices.find(v => v.lang.startsWith('fr') && (v.name.toLowerCase().includes('thomas') || v.name.toLowerCase().includes('nicolas') || v.name.toLowerCase().includes('paul') || v.name.toLowerCase().includes('male')));
                    const utterance = new SpeechSynthesisUtterance("Philippe trop gentil");
                    utterance.lang = 'fr-FR';
                    utterance.pitch = 0.4;
                    utterance.rate = 0.95;
                    if (maleVoice) utterance.voice = maleVoice;
                    window.speechSynthesis.speak(utterance);
                }
            } catch(e) {}
        }
    </script>
</body>
</html>
